<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Heatrun Overdrive - Playable Ad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; touch-action: none; }
    #game-wrapper { position: relative; width: 100vw; height: 100vh; max-width: 400px; max-height: 720px; background: #0b1329; overflow: hidden; box-shadow: 0 0 60px rgba(56, 189, 248, 0.25); border: 3px solid #1e293b; border-radius: 12px; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    
    #hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
    .hud-badge { background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; color: #38bdf8; font-weight: 900; font-size: 14px; padding: 6px 14px; border-radius: 99px; letter-spacing: 1px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

    /* End Card Overlays */
    .end-card { position: absolute; inset: 0; background: radial-gradient(circle, rgba(11,19,41,0.97) 0%, rgba(3,7,18,0.99) 100%); display: none; flex-direction: column; justify-content: center; align-items: center; padding: 28px; text-align: center; z-index: 30; cursor: pointer; }
    .end-card.active { display: flex; animation: fadeIn 0.4s ease-out forwards; }
    .alert-badge { background: #ef4444; color: #fff; font-weight: 900; font-size: 13px; padding: 6px 16px; border-radius: 99px; letter-spacing: 1.5px; margin-bottom: 16px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); animation: pulseAlert 1s infinite alternate; }
    .end-title { color: #fff; font-size: 32px; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; text-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }
    .end-subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 32px; line-height: 1.4; }
    .cta-btn { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #fff; font-size: 20px; font-weight: 900; padding: 18px 36px; border-radius: 16px; border: 3px solid #86efac; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.6); text-transform: uppercase; letter-spacing: 1px; animation: pulseBtn 1s infinite alternate; }
    
    @keyframes pulseBtn { from { transform: scale(1); box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4); } to { transform: scale(1.06); box-shadow: 0 15px 40px rgba(34, 197, 94, 0.7); } }
    @keyframes pulseAlert { from { opacity: 0.8; } to { opacity: 1; transform: scale(1.05); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="hud">
      <div class="hud-badge" id="score-display">SCORE: 0</div>
      <div class="hud-badge" id="hp-display" style="border-color: #ef4444; color: #ef4444;">ARMOR: 100%</div>
    </div>
    
    <canvas id="game-canvas" width="360" height="640"></canvas>

    <!-- Victory End Card -->
    <div id="victory-card" class="end-card">
      <div class="alert-badge">🏆 HIGHWAY ESCAPE SUCCESSFUL!</div>
      <div class="end-title">HEATRUN OVERDRIVE</div>
      <div class="end-subtitle">Download now to unlock custom supercars and open-world police chases!</div>
      <div class="cta-btn">INSTALL & PLAY NOW</div>
    </div>

    <!-- Defeat End Card -->
    <div id="defeat-card" class="end-card">
      <div class="alert-badge" style="background:#f59e0b;">💥 VEHICLE DESTROYED</div>
      <div class="end-title">MISSION FAILED</div>
      <div class="end-subtitle">Upgrade your armor and weapons in the full game!</div>
      <div class="cta-btn">TRY AGAIN / INSTALL</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const W = 360, H = 640;

    let state = 'TUTORIAL', score = 0, playTime = 0, roadOffset = 0, shootTimer = 0, bossSpawned = false, bossDefeated = false;
    const player = { x: W / 2, y: H - 100, targetX: W / 2, width: 42, height: 74, hp: 100, maxHp: 100 };
    const bullets = [];
    const enemies = [];
    const particles = [];

    // --- CROSS-DEVICE POINTER MAPPING ---
    function handlePointerMove(clientX, clientY) {
      if (state !== 'PLAYING' && state !== 'TUTORIAL') return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const canvasX = (clientX - rect.left) * scaleX;
      player.targetX = Math.max(40, Math.min(W - 40, canvasX));
      if (state === 'TUTORIAL') state = 'PLAYING';
    }

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      handlePointerMove(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointermove', (e) => {
      handlePointerMove(e.clientX, e.clientY);
    });

    const triggerStoreRedirect = () => {
      window.open('https://play.google.com/store/apps/details?id=com.nitrobyte.heatrun', '_blank');
    };
    document.getElementById('victory-card').addEventListener('click', triggerStoreRedirect);
    document.getElementById('defeat-card').addEventListener('click', triggerStoreRedirect);

    function spawnParticles(x, y, color, count = 6) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 1,
          color
        });
      }
    }

    function drawCar(x, y, width, height, bodyColor, isBoss = false) {
      ctx.save();
      ctx.translate(x, y);

      ctx.shadowBlur = isBoss ? 25 : 12;
      ctx.shadowColor = bodyColor;

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(-width / 2 + 6, -height / 2);
      ctx.lineTo(width / 2 - 6, -height / 2);
      ctx.quadraticCurveTo(width / 2 + 4, -height / 4, width / 2 - 2, height / 4);
      ctx.lineTo(width / 2 + 2, height / 2 - 4);
      ctx.lineTo(-width / 2 - 2, height / 2 - 4);
      ctx.lineTo(-width / 2 + 2, height / 4);
      ctx.quadraticCurveTo(-width / 2 - 4, -height / 4, -width / 2 + 6, -height / 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(-width / 3, -height / 6, (width / 3) * 2, height / 2.2, 5);
      ctx.fill();

      ctx.fillStyle = '#38bdf8';
      ctx.globalAlpha = 0.8;
      ctx.fillRect(-width / 3 + 4, -height / 6 + 2, (width / 3) * 2 - 8, 14);
      ctx.globalAlpha = 1.0;

      ctx.fillStyle = isBoss ? '#facc15' : '#ffffff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = ctx.fillStyle;
      ctx.fillRect(-width / 2 + 4, -height / 2, 5, 3);
      ctx.fillRect(width / 2 - 9, -height / 2, 5, 3);

      ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      if (state === 'PLAYING') {
        playTime += dt;
        roadOffset = (roadOffset + 380 * dt) % 80;
        player.x += (player.targetX - player.x) * 18 * dt;

        // Auto-fire bullets
        shootTimer += dt;
        if (shootTimer >= 0.15) {
          shootTimer = 0;
          bullets.push({ x: player.x - 10, y: player.y - 36 });
          bullets.push({ x: player.x + 10, y: player.y - 36 });
          spawnParticles(player.x, player.y + 36, '#38bdf8', 2);
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y -= 700 * dt;
          if (bullets[i].y < -20) bullets.splice(i, 1);
        }

        // Spawn wave traffic (Limited wave of 4 cars, then Boss)
        if (playTime < 7 && enemies.filter(e => !e.isBoss).length < 4 && Math.random() < 3 * dt) {
          enemies.push({ x: 50 + Math.random() * (W - 100), y: -70, hp: 3, isBoss: false });
        }

        // Spawn Boss after traffic wave is handled or at 7 seconds
        if (playTime >= 7 && !bossSpawned && enemies.filter(e => !e.isBoss).length === 0) {
          bossSpawned = true;
          enemies.push({ x: W / 2, y: -120, hp: 20, isBoss: true });
        }

        // Update enemies & collision damage
        for (let i = enemies.length - 1; i >= 0; i--) {
          let en = enemies[i];
          let w = en.isBoss ? 76 : 42;
          let h = en.isBoss ? 104 : 68;
          en.y += (en.isBoss ? 80 : 150) * dt;

          // --- PLAYER DAMAGE TAKEN FROM ENEMY COLLISION ---
          if (Math.abs(player.x - en.x) < (player.width + w) / 3 && Math.abs(player.y - en.y) < (player.height + h) / 3) {
            player.hp -= en.isBoss ? 25 : 15; // Real damage dealt to player!
            spawnParticles(player.x, player.y, '#ef4444', 10);
            enemies.splice(i, 1); // Remove enemy on crash
            
            document.getElementById('hp-display').innerText = `ARMOR: ${Math.max(0, player.hp)}%`;

            if (player.hp <= 0) {
              state = 'DEFEAT';
              document.getElementById('defeat-card').classList.add('active');
            }
            continue;
          }

          // --- BULLET DAMAGE DEALT TO ENEMY ---
          for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (Math.abs(en.x - b.x) < w / 2 && Math.abs(en.y - b.y) < h / 2) {
              bullets.splice(j, 1);
              en.hp--;
              spawnParticles(b.x, b.y, '#facc15', 3);
              if (en.hp <= 0) {
                score += en.isBoss ? 500 : 100;
                spawnParticles(en.x, en.y, '#ef4444', 14);
                document.getElementById('score-display').innerText = `SCORE: ${score}`;
                
                if (en.isBoss) bossDefeated = true;
                enemies.splice(i, 1);
                break;
              }
            }
          }

          // If enemy passes screen without being destroyed
          if (en.y > H + 50) {
            enemies.splice(i, 1);
          }
        }

        // --- VICTORY CONDITION: Wave & Boss Cleared ---
        if (bossSpawned && bossDefeated && enemies.length === 0) {
          state = 'VICTORY';
          document.getElementById('victory-card').classList.add('active');
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 3.5 * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // --- RENDERING SCENE ---
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(24, 0, W - 48, H);
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, 24, H);
      ctx.fillRect(W - 24, 0, 24, H);

      ctx.fillStyle = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#38bdf8';
      for (let y = -80; y < H; y += 80) {
        ctx.fillRect(W / 3 - 2, y + roadOffset, 4, 45);
        ctx.fillRect((W / 3) * 2 - 2, y + roadOffset, 4, 45);
      }
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#facc15';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#facc15';
      bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill(); });
      ctx.shadowBlur = 0;

      enemies.forEach(en => {
        let color = en.isBoss ? '#c084fc' : '#f87171';
        let w = en.isBoss ? 76 : 42;
        let h = en.isBoss ? 104 : 68;
        drawCar(en.x, en.y, w, h, color, en.isBoss);
      });

      drawCar(player.x, player.y, player.width, player.height, '#38bdf8', false);

      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;

      if (state === 'TUTORIAL') {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
        ctx.fillRect(0, 0, W, H);

        const handX = W / 2 + Math.sin(performance.now() * 0.005) * 80;
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('DRAG TO STEER & SHOOT!', W / 2, H / 2 - 50);

        ctx.font = '45px sans-serif';
        ctx.fillText('👆', handX, H - 120);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
