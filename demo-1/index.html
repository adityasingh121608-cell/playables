<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable Ad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: sans-serif; display: flex; justify-content: center; align-items: center; touch-action: none; }
    #game-wrapper { position: relative; width: 100vw; height: 100vh; max-width: 420px; max-height: 760px; background: #1e293b; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
    canvas { width: 100%; height: 100%; display: block; }
    #end-card { position: absolute; inset: 0; background: rgba(9,13,22,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; z-index: 20; cursor: pointer; }
    #end-card.active { display: flex; }
    .badge { background: #ef4444; color: #fff; font-weight: 800; font-size: 13px; padding: 6px 14px; border-radius: 999px; margin-bottom: 14px; text-transform: uppercase; }
    #end-title { color: #fff; font-size: 30px; font-weight: 900; margin-bottom: 10px; }
    #end-subtitle { color: #cbd5e1; font-size: 16px; margin-bottom: 28px; }
    #cta-btn { background: #22c55e; color: #fff; font-size: 20px; font-weight: 900; padding: 18px 32px; border-radius: 16px; border: 3px solid #86efac; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas" width="360" height="640"></canvas>
    <div id="end-card">
      <div class="badge">BOSS WAVE DETECTED!</div>
      <div id="end-title">DEMO RACER</div>
      <div id="end-subtitle">Upgrade armor to continue!</div>
      <div id="cta-btn">INSTALL & CONTINUE</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const W = 360, H = 640;

    let state = 'TUTORIAL', score = 0, playTime = 0, roadOffset = 0, shootTimer = 0, bossSpawned = false;
    const player = { x: W / 2, y: H - 110, targetX: W / 2 };
    const bullets = [];
    const enemies = [{ x: W / 2, y: 100, hp: 3, radius: 22, isBoss: false }];

    window.addEventListener('pointerdown', (e) => {
      if (state === 'TUTORIAL') state = 'PLAYING';
      if (state === 'PLAYING') player.targetX = Math.max(40, Math.min(W - 40, e.clientX));
    });
    window.addEventListener('pointermove', (e) => {
      if (state === 'PLAYING' && e.buttons > 0) player.targetX = Math.max(40, Math.min(W - 40, e.clientX));
    });

    document.getElementById('end-card').addEventListener('click', () => {
      window.open('https://play.google.com/store/apps/details?id=com.example.game', '_blank');
    });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      if (state === 'PLAYING') {
        playTime += dt;
        roadOffset = (roadOffset + 260 * dt) % 80;
        player.x += (player.targetX - player.x) * 14 * dt;

        shootTimer += dt;
        if (shootTimer >= 0.2) {
          shootTimer = 0;
          bullets.push({ x: player.x, y: player.y - 30 });
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y -= 500 * dt;
          if (bullets[i].y < -20) bullets.splice(i, 1);
        }

        if (playTime < 5 && Math.random() < 2 * dt) {
          enemies.push({ x: 60 + Math.random() * (W - 120), y: -40, hp: 3, radius: 22, isBoss: false });
        }
        if (playTime >= 5 && !bossSpawned) {
          bossSpawned = true;
          enemies.push({ x: W / 2, y: -80, hp: 30, radius: 52, isBoss: true });
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          let en = enemies[i];
          en.y += (en.isBoss ? 80 : 120) * dt;

          for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (Math.hypot(en.x - b.x, en.y - b.y) < en.radius + 5) {
              bullets.splice(j, 1);
              en.hp--;
              if (en.hp <= 0 && !en.isBoss) {
                enemies.splice(i, 1);
                break;
              }
            }
          }

          if ((en.isBoss && en.y >= 260) || playTime >= 9) {
            state = 'ENDCARD';
            document.getElementById('end-card').classList.add('active');
          }
        }
      }

      // Render
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#475569';
      for (let y = -80; y < H; y += 80) {
        ctx.fillRect(W / 3, y + roadOffset, 6, 40);
        ctx.fillRect((W / 3) * 2, y + roadOffset, 6, 40);
      }

      ctx.fillStyle = '#facc15';
      bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill(); });

      enemies.forEach(en => {
        ctx.fillStyle = en.isBoss ? '#a855f7' : '#ef4444';
        ctx.beginPath(); ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2); ctx.fill();
      });

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.roundRect(player.x - 20, player.y - 28, 40, 56, 8); ctx.fill();

      if (state === 'TUTORIAL') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = '900 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('DRAG TO STEER & SHOOT!', W / 2, H / 2 - 30);
        ctx.font = '38px sans-serif';
        ctx.fillText('👆', W / 2, H - 120);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
